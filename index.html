<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprovação de Orçamento Lote - HNK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --azul-hnk: #00457C;
            --azul-hover: #002d52;
            --cinza-bg: #f0f2f5;
            --vermelho-reprovar: #d93025;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--cinza-bg); margin: 0; padding: 20px; }
        
        .container { 
            max-width: 1100px; 
            margin: auto; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            overflow: hidden;
            border-top: 8px solid var(--azul-hnk);
        }

        .header { padding: 25px; border-bottom: 1px solid #eee; }
        .header h1 { margin: 0; color: var(--azul-hnk); font-size: 24px; }

        /* Grid de Informações Superiores */
        .info-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            padding: 20px 25px; 
            background: #fafafa;
        }
        .info-item label { display: block; font-size: 12px; color: #666; font-weight: bold; text-transform: uppercase; }
        .info-item span { font-size: 16px; color: #333; }

        /* Tabela Customizada */
        .table-container { 
            max-height: 500px; 
            overflow-y: auto; 
            padding: 0 25px; 
        }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        thead th { 
            position: sticky; top: 0; 
            background: white; 
            text-align: left; 
            padding: 12px; 
            border-bottom: 2px solid var(--azul-hnk);
            z-index: 10;
        }
        tbody td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        
        /* Badges de Modalidade */
        .badge { 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: bold; 
            background: #e1ecf4; 
            color: var(--azul-hnk); 
        }

        /* Botão Visualizar */
        .btn-view { background: none; border: none; color: var(--azul-hnk); cursor: pointer; font-size: 18px; }
        .btn-view:hover { color: #007bff; }

        /* Área de Ações */
        .footer-actions { padding: 25px; background: #fff; border-top: 1px solid #eee; }
        .obs-area { margin-bottom: 20px; display: none; }
        textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }

        .btn-group { display: flex; gap: 15px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        
        .btn-approve { background: var(--azul-hnk); color: white; }
        .btn-approve:hover { background: var(--azul-hover); }
        
        .btn-reject { background: #fff; color: var(--vermelho-reprovar); border: 2px solid var(--vermelho-reprovar); }
        .btn-reject:hover { background: var(--vermelho-reprovar); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Aprovação de Orçamento HNK</h1>
    </div>

    <div class="info-grid">
        <div class="info-item">
            <label>Nº Orçamento</label>
            <span id="orc-id">#882910</span>
        </div>
        <div class="info-item">
            <label>Campanha</label>
            <span id="campanha">HNK - Verão 2026</span>
        </div>
        <div class="info-item">
            <label>Solicitante</label>
            <span id="user">Camila Santos</span>
        </div>
        <div class="info-item">
            <label>Valor Total Frete</label>
            <span id="total-nf">R$ 1.250.000,00</span>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Destinatário</th>
                    <th>Cidade/UF</th>
                    <th>Peso (kg)</th>
                    <th>Valor NF</th>
                    <th>Modalidade</th>
                    <th>Frete</th>
                    <th style="text-align: center;">Itens</th>
                </tr>
            </thead>
            <tbody id="lista-destinos">
                </tbody>
        </table>
    </div>

    <div class="footer-actions">
        <div id="rejection-box" class="obs-area">
            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Motivo da Reprovação:</label>
            <textarea id="motivo" rows="3" placeholder="Descreva por que está reprovando este orçamento..."></textarea>
        </div>
        <div class="btn-group">
            <button class="btn-reject" id="btnReject" onclick="handleReprovar()">Reprovar Orçamento</button>
            <button class="btn-approve" onclick="handleAprovar()">Aprovar Orçamento</button>
        </div>
    </div>
</div>

<script>
    // Gerador de dados para exemplo (50 destinos)
    const modalidades = ["Aereo proximo voo", "Rodoviário dedicado", "Aéreo proximo dia"];
    const cidades = ["São Paulo/SP", "Rio de Janeiro/RJ", "Curitiba/PR", "Belo Horizonte/MG", "Salvador/BA", "Porto Alegre/RS", "Recife/PE"];
    const empresas = ["Distribuidora Alpha", "Logística Beta", "HNK Regional", "Depósito Central", "Varejo Sul"];

    const tbody = document.getElementById('lista-destinos');

    for (let i = 1; i <= 50; i++) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${empresas[i % 5]} ${i}</td>
            <td>${cidades[i % 7]}</td>
            <td>${(Math.random() * 500 + 50).toFixed(2)}</td>
            <td>R$ ${(Math.random() * 10000 + 1000).toLocaleString('pt-BR')}</td>
            <td><span class="badge">${modalidades[i % 3]}</span></td>
            <td style="font-weight:bold">R$ ${(Math.random() * 2000 + 300).toLocaleString('pt-BR')}</td>
            <td style="text-align: center;">
                <button class="btn-view" onclick="verItens(${i})"><i class="fa-solid fa-circle-info"></i></button>
            </td>
        `;
        tbody.appendChild(row);
    }

    // Lógica dos Botões
    let estaReprovando = false;

    function handleReprovar() {
        const box = document.getElementById('rejection-box');
        const btn = document.getElementById('btnReject');
        const motivo = document.getElementById('motivo').value;

        if (!estaReprovando) {
            box.style.display = 'block';
            btn.innerText = 'Confirmar Reprovação';
            estaReprovando = true;
        } else {
            if (motivo.length < 5) {
                alert("Por favor, preencha o motivo da reprovação.");
                return;
            }
            alert("Orçamento Reprovado com sucesso!");
            // Aqui o desenvolvedor envia os dados para o servidor
        }
    }

    function handleAprovar() {
        if(confirm("Deseja confirmar a aprovação total deste lote?")) {
            alert("Orçamento Aprovado com sucesso!");
            // Integração com API
        }
    }

    function verItens(id) {
        alert("Abrindo detalhamento dos itens do destino " + id);
        // Aqui pode abrir um Modal com a lista de SKUs
    }
</script>

</body>
</html>
